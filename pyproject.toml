[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowaware-execution"
version = "0.1.0"
description = "Multi-client execution under shared liquidity constraints"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
